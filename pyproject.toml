[project]
name = "wha-spell-decoder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "altrup", email = "51763643+altrup@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "anthropic>=2.3.0",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "tokenizer>=3.7.0",
    "torch>=2.14.1",
]

[project.scripts]
wha-spell-decoder = "wha_spell_decoder:main"
wha-spell-fetch = "wha_spell_decoder.data.fetch:main"
wha-spell-annotate = "wha_spell_decoder.data.annotate:main"
wha-spell-review = "wha_spell_decoder.data.review:main"
wha-spell-synth = "wha_spell_decoder.data.synth:main"
wha-spell-train = "wha_spell_decoder.train:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "transformers>=5.22.1",
    "ty>=0.0.99",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.poe.tasks]
format = { shell = "ruff check --select I --fix . && ruff format ." }

[tool.pytest.ini_options]
markers = ["slow: downloads real model weights"]
addopts = "-m 'not slow'"
