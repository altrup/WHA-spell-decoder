[project]
name = "wha-spell-decoder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "altrup", email = "51763643+altrup@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "anthropic>=2.3.0",
    "python-dotenv>=1.2.4",
    "torch>=2.14.1",
    "transformers>=5.21.0",
]

[project.scripts]
wha-spell-decoder = "wha_spell_decoder:main"
wha-spell-fetch = "wha_spell_decoder.data.fetch:main"
wha-spell-annotate = "wha_spell_decoder.data.annotate:main"
wha-spell-review = "wha_spell_decoder.data.review:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
